services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: news_dw
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - kafka
      - postgres
    volumes:
      - ./:/project
    working_dir: /project
    command: tail -f /dev/null

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    volumes:
      - ./:/project
    working_dir: /project
    command: streamlit run app/dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news_user:news_pass@postgres:5432/news_dw
    working_dir: /project
    command: >
      bash -c "airflow db init &&
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin"
    volumes:
      - ./:/project

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news_user:news_pass@postgres:5432/news_dw
      AIRFLOW__CORE__DAGS_FOLDER: /project/airflow/dags
      PYTHONPATH: /project
    ports:
      - "8080:8080"
    working_dir: /project
    command: airflow webserver
    volumes:
      - ./:/project

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news_user:news_pass@postgres:5432/news_dw
      AIRFLOW__CORE__DAGS_FOLDER: /project/airflow/dags
      PYTHONPATH: /project
    working_dir: /project
    command: airflow scheduler
    volumes:
      - ./:/project
